name: APK derle

# Elle çalıştırılabilir; iptv/ altında değişiklik olduğunda da kendiliğinden derler.
on:
  workflow_dispatch:
  push:
    paths:
      - 'iptv/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # rolling "latest" sürümünü güncellemek için

jobs:
  build:
    name: Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Web uygulamasını ve listeleri doğrula
        run: |
          set -e
          for f in iptv/index.html iptv/js/app.js iptv/vendor/hls.min.js \
                   iptv/vendor/mpegts.js iptv/playlists/turkiye.m3u iptv/playlists/dunya.m3u; do
            test -s "$f" || { echo "eksik ya da boş: $f"; exit 1; }
          done
          for f in iptv/js/*.js iptv/sw.js iptv/tools/*.js; do node --check "$f"; done
          echo "kanal sayısı: $(grep -c '^#EXTINF' iptv/playlists/dunya.m3u)"

      # Vekil, gerçek IPTV'de en çok iş yapan ve en çok kırılan parça. İki ayrı
      # uygulaması var (Node ve APK'nın içindeki Java) ve ikisi de aynı
      # sözleşmeyi tutmak zorunda. Aynı test ikisine de koşuyor.
      - name: Vekil sözleşme testi — Node
        run: |
          set -e
          node iptv/tools/server.js --port 8156 --host 127.0.0.1 &
          for i in $(seq 1 50); do
            curl -sf -o /dev/null http://127.0.0.1:8156/index.html && break || sleep 0.2
          done
          node iptv/tools/proxy-test.js --proxy http://127.0.0.1:8156 \
            --label "tools/server.js (Node)" --static

      - name: Vekil sözleşme testi — Android LocalServer (JVM)
        run: bash iptv/android/jvmtest/run.sh

      - name: APK derle
        working-directory: iptv/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK içeriğini doğrula
        run: |
          set -e
          APK=$(find iptv/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "APK üretilmemiş"; exit 1; }
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"

          LIST=$(unzip -Z1 "$APK")

          # gömülü web uygulaması ve kanal listeleri gerçekten içeride mi?
          for f in assets/web/index.html \
                   assets/web/css/app.css \
                   assets/web/js/app.js \
                   assets/web/js/player.js \
                   assets/web/vendor/hls.min.js \
                   assets/web/vendor/mpegts.js \
                   assets/web/playlists/turkiye.m3u \
                   assets/web/playlists/dunya.m3u \
                   assets/web/version.json \
                   classes.dex \
                   AndroidManifest.xml; do
            echo "$LIST" | grep -qx "$f" || { echo "APK içinde yok: $f"; exit 1; }
          done

          # TV afişi (aapt dosya adını değiştirebilir, gevşek arıyoruz)
          echo "$LIST" | grep -qi 'banner' || { echo "TV afişi APK içinde yok"; exit 1; }

          # Uygulama sınıfları gerçekten derlendi mi? classes.dex yalnızca üretilen
          # R sınıflarını içerebiliyor, asıl kod classes2.dex'e düşüyor. Sadece
          # "classes.dex var mı" diye bakmak, kodu hiç derlenmemiş bir APK'yı da
          # geçirir; o APK kurulur ama açılışta çöker.
          APKABS=$(readlink -f "$APK")
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          (cd /tmp/dexcheck && unzip -o -q "$APKABS" 'classes*.dex')
          for cls in MainActivity LocalServer; do
            grep -qa "industry/nomads/iptv/$cls" /tmp/dexcheck/classes*.dex \
              || { echo "derlenmiş sınıf APK içinde yok: $cls"; exit 1; }
          done
          echo "derlenmiş sınıflar doğrulandı ($(ls /tmp/dexcheck | tr '\n' ' '))"

          TR=$(unzip -p "$APK" assets/web/playlists/turkiye.m3u | grep -c '^#EXTINF')
          DU=$(unzip -p "$APK" assets/web/playlists/dunya.m3u | grep -c '^#EXTINF')
          echo "gömülü kanallar -> Türkiye: $TR, Dünya: $DU"
          test "$TR" -gt 150 || { echo "Türkiye paketi eksik"; exit 1; }
          test "$DU" -gt 9000 || { echo "Dünya paketi eksik"; exit 1; }

          echo "APK bütün: web uygulaması, iki kanal paketi ve iki yayın motoru içeride"
          cp "$APK" nomads-industry-iptv.apk
          echo "APK_OUT=nomads-industry-iptv.apk" >> "$GITHUB_ENV"

      - name: APK'yı iş çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: nomads-industry-iptv-apk
          path: iptv/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # Actions çıktılarını indirmek için GitHub hesabı gerekiyor. Kurulumu
      # paylaşacağın kişilerin hesabı olmayabilir; bu yüzden APK ayrıca sabit
      # bir "latest" sürümüne konuyor. O bağlantı herkese açık ve değişmiyor:
      #   https://github.com/<kullanıcı>/<depo>/releases/download/latest/nomads-industry-iptv.apk
      - name: Sabit indirme bağlantısını güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES=$(printf '%s\n' \
            "NOMADS INDUSTRY IPTV — Android TV uygulaması." \
            "" \
            "Bu bağlantı hep en son derlemeyi verir; GitHub hesabı gerekmez." \
            "" \
            "Kurulum: TV'de Ayarlar → Cihaz tercihleri → Güvenlik → Bilinmeyen" \
            "kaynaklar'a izin ver, sonra APK'yı USB ya da 'Send Files to TV' ile" \
            "TV'ye at ve kur." \
            "" \
            "Derleme: ${GITHUB_SHA}")
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_OUT" --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$APK_OUT" \
              --title "NOMADS INDUSTRY IPTV (son sürüm)" \
              --notes "$NOTES" \
              --prerelease
          fi
          echo "indirme bağlantısı: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/latest/nomads-industry-iptv.apk"
