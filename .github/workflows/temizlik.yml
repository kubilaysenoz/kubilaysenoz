name: Temizlik

# Geçici iş. IPTV projesinin genel depodaki izlerini siler, sonra kendisi silinir.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temizlik.yml']

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAL: claude/iptv-philips-smart-tv-e7450j
    steps:
      - name: Başlangıç durumu
        run: |
          echo "--- dallar ---"
          gh api "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name'
          echo "--- release ---"
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | "\(.tag_name)  \(.assets[].name)"' || echo "(yok)"
          echo "--- etiketler ---"
          gh api "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' || echo "(yok)"

      - name: Release ve APK sil
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            && echo "release silindi" || echo "release zaten yok"

      - name: Etiketi sil (release ile gitmediyse)
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            && echo "etiket silindi" || echo "etiket zaten yok"

      - name: IPTV dalını sil
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$DAL" \
            && echo "dal silindi" || echo "dal zaten yok"

      - name: Son durum
        run: |
          echo "--- kalan dallar ---"
          gh api "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name'
          echo "--- kalan release ---"
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' || true
          echo "--- kalan etiketler ---"
          gh api "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' || true
          echo "--- main içeriği ---"
          gh api "repos/$GITHUB_REPOSITORY/contents?ref=main" --jq '.[].path'
